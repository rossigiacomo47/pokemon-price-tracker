name: Fotografia settimanale del mercato

on:
  schedule:
    # Lunedi' alle 11:00 UTC = 13:00 italiane con l'ora legale, 12:00 con l'ora solare.
    # TCGdex aggiorna i prezzi Cardmarket verso le 10:00 UTC.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova: numero di carte per lingua (lascia vuoto per la fotografia completa)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fotografia
  cancel-in-progress: false

jobs:
  fotografia:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Prova (poche carte, non salva nulla nel repository)
        if: ${{ inputs.prova != '' }}
        run: python src/scarica_tcgdex.py --prova "${{ inputs.prova }}"

      - name: Fotografia TCGdex (Cardmarket e TCGplayer)
        if: ${{ !inputs.prova }}
        run: python src/scarica_tcgdex.py

      - name: Promo giapponesi da TCGCSV
        if: ${{ !inputs.prova }}
        run: python src/scarica_tcgcsv_promo_ja.py

      - name: Riepilogo
        run: python src/riepilogo.py

      - name: Salva nel repository
        if: ${{ !inputs.prova }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data riepiloghi
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo da salvare."
          else
            git commit -m "Fotografia del mercato $(date -u +%G-W%V)"
            git push
          fi
